<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oura Data Fetcher</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; }
    form { max-width: 400px; margin: auto; }
    label { display: block; margin-top: 1em; }
    input[type="text"], input[type="date"] { width: 100%; padding: 0.5em; margin-top: 0.2em; }
    button { margin-top: 1.5em; padding: 0.7em 1.5em; }
    .result { margin-top: 2em; }
  </style>
</head>
<body>
  <h1>Oura Data Fetcher</h1>
  <div style="max-width: 400px; margin: 0 auto 1em;">
    <button id="authorizeBtn" type="button">Authorize Oura</button>
    <p id="authStatus" style="margin-top: 0.75em; color: #555;"></p>
  </div>
  <form id="ouraForm">
    <label for="start">Start Date:</label>
    <input type="date" id="start" name="start" required>

    <label for="end">End Date:</label>
    <input type="date" id="end" name="end" required>

    <!-- Data is always saved as JSON now -->

    <button type="submit">Fetch Data</button>
  </form>
  <div class="result" id="result"></div>
  <div style="max-width:700px;margin:auto;">
    <h2>Stress & Meditation Comparison</h2>
    <canvas id="stressMeditationChart"></canvas>
  </div>
  <script src="charts.js"></script>
  <script src="main.js"></script>
</body>
</html>
