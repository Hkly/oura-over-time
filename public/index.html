<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oura Over Time - Oura Data Visualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Oura Over Time</h1>
      <p class="subtitle">Tracking your wellness journey over time</p>
      <nav class="top-nav">
        <a class="nav-link" href="/stress.html">Stress & Meditation Chart</a>
      </nav>
    </header>

    <main>
      <section class="controls-section">
        <div class="controls-row">
          <button id="authorizeBtn" type="button">Authorize Oura</button>
          <p id="authStatus" class="auth-status"></p>
        </div>
        <div class="range-buttons">
          <button type="button" class="range-button" data-range="3m">Last 3 months</button>
          <button type="button" class="range-button" data-range="6m">Last 6 months</button>
          <button type="button" class="range-button" data-range="1y">Last year</button>
        </div>
        <form id="ouraForm" class="controls-form">
          <label for="start">Start Date:</label>
          <input type="date" id="start" name="start" required>
          <label for="end">End Date:</label>
          <input type="date" id="end" name="end" required>
          <button type="submit">Fetch Data</button>
        </form>
        <p class="result" id="result"></p>
      </section>

      <section class="graph-section">
        <div class="graph-header">
          <h2>💤 Sleep</h2>
          <p class="graph-description">Daily total sleep duration</p>
        </div>
        <div id="sleep-graph" class="contribution-graph"></div>
      </section>

      <section class="graph-section">
        <div class="graph-header">
          <h2>🏃 Activity</h2>
          <p class="graph-description">Daily step count</p>
        </div>
        <div id="activity-graph" class="contribution-graph"></div>
        <p class="graph-description sub-graph-description">Workout minutes</p>
        <div id="workout-graph" class="contribution-graph"></div>
      </section>

      <section class="graph-section">
        <div class="graph-header">
          <h2>🧘 Meditation</h2>
          <p class="graph-description">Meditation minutes from session data</p>
        </div>
        <div id="meditation-graph" class="contribution-graph"></div>
      </section>
    </main>

    <footer>
      <p>Data visualization inspired by GitHub contribution graphs</p>
    </footer>
  </div>
  <script src="main.js"></script>
</body>
</html>
