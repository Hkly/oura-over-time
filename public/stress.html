<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stress & Meditation - Oura Data Fetcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Stress & Meditation</h1>
      <p class="subtitle">Secondary visualization page</p>
      <nav class="top-nav">
        <a class="nav-link" href="/">Back to Dashboard</a>
      </nav>
    </header>

    <main>
      <section class="controls-section">
        <div class="controls-row">
          <button id="authorizeBtn" type="button">Authorize Oura</button>
          <p id="authStatus" class="auth-status"></p>
        </div>
        <form id="ouraForm" class="controls-form">
          <label for="start">Start Date:</label>
          <input type="date" id="start" name="start" required>
          <label for="end">End Date:</label>
          <input type="date" id="end" name="end" required>
          <button type="submit">Fetch Data</button>
        </form>
        <p class="result" id="result"></p>
      </section>

      <section class="secondary-visual">
        <h2>Stress & Meditation Comparison</h2>
        <canvas id="stressMeditationChart"></canvas>
      </section>
    </main>

    <footer>
      <p>Data visualization inspired by GitHub contribution graphs</p>
    </footer>
  </div>
  <script src="charts.js"></script>
  <script src="main.js"></script>
</body>
</html>
